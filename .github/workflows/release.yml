# ===== 自动打包 Windows EXE 并发布 =====
# 触发：推送版本标签（如 git tag v4.0.0 && git push origin v4.0.0），或在 Actions 页面手动运行
# 结果：
#   1. 在 GitHub Release 上传 EduPuzzle.exe（任何大小都行，单文件上限 2 GB）
#      下载地址固定为 https://github.com/<用户名>/<仓库名>/releases/latest/download/EduPuzzle.exe
#   2. 如果 EXE 小于 100 MB 且 COMMIT_EXE_TO_REPO 为 true，同时提交到 main 分支的 release/EduPuzzle.exe，
#      随后 gh-pages.yml 会自动重新部署，下载页优先使用网站上的这个文件
#   超过 100 MB 时只上传 Release（GitHub 仓库不允许提交超过 100 MB 的文件），下载页自动指向 Release

name: 打包 Windows EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: write       # 提交 EXE 后手动启动一次 Pages 部署（见最后一步）

env:
  COMMIT_EXE_TO_REPO: 'true'     # 不想把 EXE 提交进仓库就改成 'false'

jobs:
  build-exe:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译结果（第二次打包快很多）
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Tauri 命令行
        run: npm ci

      - name: 编译单文件 EXE
        run: npx tauri build --no-bundle

      - name: 整理文件并检查大小
        id: exe
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/edupuzzle.exe EduPuzzle.exe
          $mb = [math]::Round((Get-Item EduPuzzle.exe).Length / 1MB, 1)
          Write-Host "EduPuzzle.exe：$mb MB"
          "small=$([int]($mb -lt 95))" >> $env:GITHUB_OUTPUT

      - name: 上传到 GitHub Release（打标签时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: EduPuzzle.exe
          generate_release_notes: true

      - name: 上传为构建产物（手动运行时，可在本次运行页面下载）
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: EduPuzzle-exe
          path: EduPuzzle.exe

      - name: 小于 100 MB 时提交到仓库 release/ 文件夹
        if: env.COMMIT_EXE_TO_REPO == 'true' && steps.exe.outputs.small == '1'
        shell: pwsh
        run: |
          git fetch origin main
          git checkout main
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item EduPuzzle.exe release/EduPuzzle.exe -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/EduPuzzle.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "release: 更新 EduPuzzle.exe（${{ github.ref_name }}）"
            git push origin main
          } else { Write-Host "EXE 没有变化，无需提交" }

      # GitHub 规定：工作流用自带令牌推送的提交不会触发其它工作流，
      # 所以这里手动启动一次 Pages 部署，让网站上的 release/EduPuzzle.exe 更新
      - name: 重新部署 Pages
        if: env.COMMIT_EXE_TO_REPO == 'true' && steps.exe.outputs.small == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gh-pages.yml --ref main
