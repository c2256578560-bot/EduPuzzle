# ===== 自动部署到 GitHub Pages =====
# 触发：推送到 main 分支，或在 Actions 页面手动运行
# 结果：https://<用户名>.github.io/<仓库名>/          → PWA 主程序
#       https://<用户名>.github.io/<仓库名>/download.html → 分享下载页
#       https://<用户名>.github.io/<仓库名>/release/EduPuzzle.exe（如果仓库 release/ 里有）
# 首次使用：仓库 Settings → Pages → Source 选「GitHub Actions」

name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新提交会取消旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 生成网站文件（复制到 dist/）
        run: node scripts/build-web.mjs

      - name: 检查 EXE 大小（GitHub 单文件上限 100 MB）
        run: |
          if [ -f dist/release/EduPuzzle.exe ]; then
            ls -lh dist/release/EduPuzzle.exe
          else
            echo "仓库 release/ 里没有 EXE，下载页会自动改用 GitHub Release 的下载地址"
          fi

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传网站
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
